<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>啟動 BMI App</title>
    <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
</head>
<body>
    <h2>正在連接至本地授權伺服器 (Keycloak)...</h2>
    <script>
        FHIR.oauth2.authorize({
            // 1. 指向您本地端的 HAPI FHIR Server
            iss: "http://DL1C310PC1:8080/fhir",
            
            // 2. 剛剛在 Keycloak 設定的 Client ID
            clientId: "test-client", 
            scope: "user/*.read openid fhirUser",
            
            // 3. 授權成功後跳轉的主程式
            redirectUri: "index.html",
            
            // 4. 強制指定使用本地端 Keycloak 作為授權與換發 Token 的中心
            authorizeUri: "http://localhost:8081/realms/fhir/protocol/openid-connect/auth",
            tokenUri: "http://localhost:8081/realms/fhir/protocol/openid-connect/token"
        });
    </script>
</body>
</html>
